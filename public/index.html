
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b16;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:18px;text-align:center;
 background:#10172b;border-bottom:1px solid #00eaff;
}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff}
.status{font-size:12px;color:#00eaff}
#chat{
 height:calc(100dvh - 190px);
 overflow-y:auto;padding:15px;
 display:flex;flex-direction:column;gap:12px;
}
.msg{
 padding:13px;border-radius:14px;
 max-width:88%;white-space:pre-wrap;
 overflow-wrap:anywhere;line-height:1.5;
}
.user{align-self:flex-end;background:#174e70}
.ai{align-self:flex-start;background:#171e32;border:1px solid #263e60}
form{
 position:fixed;bottom:0;width:100%;
 display:flex;gap:7px;padding:10px;
 background:#10172b;border-top:1px solid #263e60;
}
input{
 flex:1;min-width:0;padding:13px;
 border-radius:12px;border:1px solid #00eaff;
 background:#080e1d;color:white;font-size:16px;
}
button{
 border:0;border-radius:12px;
 background:#00eaff;color:#001018;
 padding:0 15px;font-weight:bold;font-size:17px;
}
button:disabled{opacity:.5}
#voice.active{background:#ff426d;color:white}
#speak.active{background:#8c6bff;color:white}
</style>
</head>

<body>
<header>
<h1>✦ NEON AI</h1>
<div class="status">GAMING INTELLIGENCE · ONLINE</div>
</header>

<div id="chat">
 <div class="msg ai">
 Привет! Я NEON AI 🤖
 Теперь я умею слушать и говорить!
 </div>
</div>

<form id="form">
<button type="button" id="voice" title="Голосовой ввод">🎤</button>
<input id="input" placeholder="Напиши сообщение..." autocomplete="off">
<button type="submit">➤</button>
<button type="button" id="speak" title="Озвучка ответов">🔊</button>
</form>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const form=document.getElementById("form");
const voice=document.getElementById("voice");
const speak=document.getElementById("speak");

let messages=[];
let speechEnabled=true;
let recognition=null;

function add(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

// Озвучивание ответов
function say(text){
 if(!speechEnabled || !("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ru-RU";
 utterance.rate=1;
 utterance.pitch=1;

 speechSynthesis.speak(utterance);
}

// Переключение озвучки
speak.addEventListener("click",()=>{
 speechEnabled=!speechEnabled;
 speak.classList.toggle("active",speechEnabled);
 speak.textContent=speechEnabled?"🔊":"🔇";

 if(!speechEnabled && "speechSynthesis" in window){
  speechSynthesis.cancel();
 }
});

// Голосовое распознавание
const SpeechRecognition=
 window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="ru-RU";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  voice.classList.add("active");
  voice.textContent="🔴";
 };

 recognition.onend=()=>{
  voice.classList.remove("active");
  voice.textContent="🎤";
 };

 recognition.onresult=(event)=>{
  input.value=event.results[0][0].transcript;
  input.focus();
 };

 recognition.onerror=(event)=>{
  add("Ошибка микрофона: "+event.error,"ai");
 };
}else{
 voice.title="Распознавание речи не поддерживается этим браузером";
}

voice.addEventListener("click",()=>{
 if(!recognition){
  add("Твой браузер не поддерживает голосовой ввод. Попробуй Chrome.","ai");
  return;
 }

 try{
  recognition.start();
 }catch(err){
  add("Не удалось запустить микрофон. Попробуй ещё раз.","ai");
 }
});

// Отправка сообщения
form.addEventListener("submit",async e=>{
 e.preventDefault();

 const text=input.value.trim();
 if(!text)return;

 input.value="";
 add(text,"user");
 messages.push({role:"user",content:text});

 const waiting=add("NEON AI думает... ⚡","ai");
 const sendButton=form.querySelector('button[type="submit"]');
 sendButton.disabled=true;

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:messages.slice(-20)})
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Ошибка API");

  waiting.textContent=data.reply;
  messages.push({role:"assistant",content:data.reply});

  say(data.reply);

 }catch(err){
  waiting.textContent="Ошибка: "+err.message;
 }

 sendButton.disabled=false;
 chat.scrollTop=chat.scrollHeight;
 input.focus();
});
</script>
</body>
</html>
